name: Update README blog table

on:
  push:
    branches: ["**"]
    paths:
      - "blog/index.json"
      - "blog/**.html"

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate blog table in README
        run: python3 scripts/update_readme.py

      - name: Commit updated README (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (
            git add README.md &&
            git commit -m "docs: auto-update blog table in README" &&
            git push
          )
